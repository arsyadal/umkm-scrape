<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h3 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #38bdf8;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .badge {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h3>🏪 UMKM Radius Scraper</h3>
  <p>Buka <b>Google Maps</b> di browser Anda. Widget floating radius akan otomatis muncul di pojok kanan bawah.</p>
  <div class="badge">Status: Ready di google.com/maps</div>
  <button id="open-gmaps">📍 Buka Google Maps</button>
  <script src="popup.js"></script>
</body>
</html>
